name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build for iOS Simulator
        run: |
          set +e
          xcodebuild build \
            -project PaperFront.xcodeproj \
            -scheme PaperFront \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          echo "=== ERRORS ==="
          grep -E "error:" build.log | sort -u | head -80
          echo "=== exit $status ==="
          exit $status
